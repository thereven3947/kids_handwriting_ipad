<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5ec7ff" />
    <meta
      name="description"
      content="Kid-friendly handwriting practice app for iPad Air. Learn tracing and letter formation with guided practice."
    />
    <link rel="manifest" href="./manifest.webmanifest?v=2" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png?v=2" />
    <link rel="stylesheet" href="./styles.css?v=2" />
    <title>Little Letter Practice</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Practice Time</p>
          <h1>Little Letter Practice</h1>
        </div>
        <div class="header-actions">
          <label class="letter-picker" for="letter-select">
            <span>Letter</span>
            <select id="letter-select" aria-label="Choose a letter">
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
              <option value="E">E</option>
              <option value="F">F</option>
              <option value="G">G</option>
              <option value="H">H</option>
              <option value="I">I</option>
              <option value="J">J</option>
              <option value="K">K</option>
              <option value="L">L</option>
              <option value="M">M</option>
              <option value="N">N</option>
              <option value="O">O</option>
              <option value="P">P</option>
              <option value="Q">Q</option>
              <option value="R">R</option>
              <option value="S">S</option>
              <option value="T">T</option>
              <option value="U">U</option>
              <option value="V">V</option>
              <option value="W">W</option>
              <option value="X">X</option>
              <option value="Y">Y</option>
              <option value="Z">Z</option>
            </select>
          </label>
          <button id="install-button" class="secondary-button hidden" type="button">
            Install App
          </button>
        </div>
      </header>

      <main class="practice-panel">
        <section class="letter-box">
          <p class="label">Today’s letter</p>
          <div id="target-letter" class="target-letter">A</div>
          <p class="hint">Trace the letter with your finger.</p>
        </section>

        <div class="canvas-card">
          <div id="congrats-overlay" class="congrats-overlay hidden" aria-live="polite">
            <div class="congrats-badge">
              <div class="sparkles" aria-hidden="true"></div>
              <div class="badge-star">★</div>
              <h2 id="reward-title">Great Job!</h2>
              <p id="reward-text">You traced it perfectly!</p>
            </div>
          </div>
          <canvas id="practice-canvas" width="700" height="420" aria-label="Handwriting practice area"></canvas>
        </div>

        <div class="toolbar" aria-label="Tools">
          <button class="tool-button primary" data-tool="pen" type="button">Pencil</button>
          <button class="tool-button" data-tool="eraser" type="button">Eraser</button>
          <button class="tool-button" data-action="clear" type="button">Clear</button>
          <button class="tool-button" data-action="check" type="button">Check Answer</button>
          <button class="tool-button" data-action="next" type="button">Next Letter</button>
        </div>

        <div class="palette" aria-label="Color palette">
          <button class="swatch active" data-color="#1E88E5" style="background:#1E88E5" type="button" aria-label="Blue pen"></button>
          <button class="swatch" data-color="#7CB342" style="background:#7CB342" type="button" aria-label="Green pen"></button>
          <button class="swatch" data-color="#FF7043" style="background:#FF7043" type="button" aria-label="Orange pen"></button>
          <button class="swatch" data-color="#8E24AA" style="background:#8E24AA" type="button" aria-label="Purple pen"></button>
        </div>

        <div class="install-note">
          <strong>iPad installation:</strong> open this page in Safari, tap the Share button, then choose “Add to Home Screen.”
        </div>
      </main>
    </div>

    <script src="./app.js?v=2"></script>
  </body>
</html>
